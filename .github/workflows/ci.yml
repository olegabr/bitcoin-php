name: CI

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    # PHP 8.5 needs the buffertools fix (empty buffer / gmp_init). Until the
    # fork is tagged (v0.5.8) composer installs v0.5.7, which still fails a few
    # DER edge cases there, so the 8.5 leg is informational for now.
    continue-on-error: ${{ matrix.php == '8.5' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, mbstring, json
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: vendor/bin/phpunit
